spring.application.name=03-roles

spring.datasource.url=jdbc:mysql://localhost:3306/security_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Esperar a que Hibernate termine de crear/actualizar tablas
spring.jpa.defer-datasource-initialization=true

#Carga el archivo data.sql
spring.sql.init.mode=always

server.port=8080

# El secreto NO tiene valor por defecto a propósito: si la variable de
# entorno JWT_SECRET no existe, la app falla al arrancar en vez de arrancar
# con un secreto debil silenciosamente. Debe tener 32+ caracteres (256 bits)
# para el algoritmo HS256.
jwt.secret=0EWv3MeCvz+sxeUpEZHt3YhPxzqQPYkYCDURbzAe8hs=
# Tiempo de vida del token, en milisegundos. 3600000 = 1 hora. Este sí tiene
# default porque no es sensible, solo configuracion.
jwt.expiration-ms=36000000
