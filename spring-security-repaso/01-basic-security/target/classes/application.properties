spring.application.name=01-basic-security

spring.datasource.url=jdbc:mysql://localhost:3306/security_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Esperar a que Hibernate termine de crear/actualizar tablas
spring.jpa.defer-datasource-initialization=true

#Carga el archivo data.sql
spring.sql.init.mode=always

server.port=8080
